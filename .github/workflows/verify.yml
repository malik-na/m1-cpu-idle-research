name: Verify research packet

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify_repository.py
      - run: python3 -m unittest discover -s experiments/linux-apsc-observer -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/linux-counter-qualification -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/linux-pcpm-sampler -p 'test_*.py'
      - run: python3 experiments/linux-pcpm-sampler/check_control_parser.py
